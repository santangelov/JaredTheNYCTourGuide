name: Apply Met video page integration

on:
  push:
    branches:
      - 09-14-Met-Video
    paths:
      - .github/workflows/apply-met-video-page.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 09-14-Met-Video

      - name: Update Met tour page
        shell: python
        run: |
          from pathlib import Path

          path = Path("Met_Museum_of_Art_Walking_Tour.htm")
          text = path.read_text(encoding="utf-8")

          old = '''    <meta property="og:image:alt" content="Jared with guests on a private Metropolitan Museum of Art tour in New York City" />'''
          new = old + '''
    <meta property="og:video" content="https://jaredthenyctourguide.com/videos/met-private-tour-experience.mp4" />
    <meta property="og:video:secure_url" content="https://jaredthenyctourguide.com/videos/met-private-tour-experience.mp4" />
    <meta property="og:video:type" content="video/mp4" />
    <meta property="og:video:width" content="480" />
    <meta property="og:video:height" content="854" />'''
          if old not in text:
              raise SystemExit("Open Graph insertion point not found")
          text = text.replace(old, new, 1)

          old = '''    <link type="text/css" href="Styles/landing.css?ver=1.9" rel="stylesheet" />'''
          new = old + '''
    <link type="text/css" href="Styles/met-video.css?ver=1.0" rel="stylesheet" />'''
          if old not in text:
              raise SystemExit("Stylesheet insertion point not found")
          text = text.replace(old, new, 1)

          video_json_ld = '''    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "VideoObject",
      "@id": "https://jaredthenyctourguide.com/Met_Museum_of_Art_Walking_Tour.htm#tour-video",
      "name": "A Private Met Museum Tour with Jared",
      "description": "A short look at a private Metropolitan Museum of Art tour experience with Jared The NYC Tour Guide in New York City.",
      "thumbnailUrl": "https://jaredthenyctourguide.com/images/Met_Museum/met-private-tour-video-poster.jpg",
      "uploadDate": "2026-09-14",
      "duration": "PT47S",
      "contentUrl": "https://jaredthenyctourguide.com/videos/met-private-tour-experience.mp4",
      "encodingFormat": "video/mp4",
      "mainEntityOfPage": {"@id": "https://jaredthenyctourguide.com/Met_Museum_of_Art_Walking_Tour.htm#webpage"},
      "about": {"@id": "https://jaredthenyctourguide.com/Met_Museum_of_Art_Walking_Tour.htm#service"},
      "creator": {
        "@type": "Organization",
        "name": "Just Ask Christine",
        "url": "https://justaskchristine.com/"
      }
    }
    </script>
'''
          if '</head>' not in text:
              raise SystemExit("Head closing tag not found")
          text = text.replace('</head>', video_json_ld + '</head>', 1)

          marker = '''            <!-- WITHOUT THE OVERWHELM -->'''
          video_section = '''            <!-- PRIVATE TOUR VIDEO -->
            <section class="metVideoSection" aria-labelledby="met-tour-video-heading">
                <div class="landingInner metVideoLayout">
                    <div class="metVideoCopy">
                        <span class="landingEyebrow">See the Experience</span>
                        <h2 id="met-tour-video-heading">Take a Quick Look at a Private Met Tour</h2>
                        <p class="metVideoLead">This short video offers a glimpse of a private Met visit with Jared&mdash;moving through the galleries together and taking in some of the museum&rsquo;s memorable spaces.</p>
                        <p>It is not a fixed itinerary. Jared&rsquo;s Met tours are built around the people in front of him, their interests, ages and pace.</p>
                        <div class="metVideoHighlights" aria-label="Private Met tour highlights">
                            <span>Private &amp; customized</span>
                            <span>At your pace</span>
                            <span>Art, history &amp; stories</span>
                        </div>
                        <div class="landingCtas">
                            <a class="landingButton landingButtonPrimary" href="tourBooking.aspx">Plan Your Private Met Tour</a>
                        </div>
                    </div>

                    <figure class="metVideoFigure">
                        <div class="metVideoFrameShell">
                            <div class="metVideoFrame">
                                <video controls muted playsinline preload="metadata" poster="images/Met_Museum/met-private-tour-video-poster.jpg" aria-label="A short look at a private Metropolitan Museum of Art tour with Jared">
                                    <source src="videos/met-private-tour-experience.mp4" type="video/mp4" />
                                    Your browser does not support HTML5 video. <a href="videos/met-private-tour-experience.mp4">Watch the Met tour video</a>.
                                </video>
                            </div>
                        </div>
                        <figcaption>
                            <span>Video created by <a href="https://justaskchristine.com/" target="_blank" rel="noopener">Just Ask Christine</a>.</span>
                            <span class="metVideoPlaybackNote">Press play to watch. Sound starts muted.</span>
                        </figcaption>
                    </figure>
                </div>
            </section>

'''
          if marker not in text:
              raise SystemExit("Video section insertion point not found")
          text = text.replace(marker, video_section + marker, 1)

          path.write_text(text, encoding="utf-8", newline="\n")

      - name: Remove one-time workflow
        run: rm .github/workflows/apply-met-video-page.yml

      - name: Commit page update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Met_Museum_of_Art_Walking_Tour.htm .github/workflows/apply-met-video-page.yml
          git commit -m "Add Met tour video section and SEO metadata"
          git push origin HEAD:09-14-Met-Video
